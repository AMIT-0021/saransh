<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="favBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#042F2E" />
      <stop offset="45%" stopColor="#0F766E" />
      <stop offset="100%" stopColor="#0D9488" />
    </linearGradient>
    <linearGradient id="favPulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="50%" stopColor="#A7F3D0" />
      <stop offset="100%" stopColor="#22D3EE" />
    </linearGradient>
    <linearGradient id="favCross" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0F766E" />
      <stop offset="100%" stopColor="#06B6D4" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="96" height="96" rx="26" fill="url(#favBadge)" />
  <rect x="3" y="3" width="94" height="94" rx="25" stroke="#2DD4BF" stroke-width="2" stroke-opacity="0.5" />

  <!-- Semi-transparent Medical Cross -->
  <path d="M38 18 H62 V38 H82 V62 H62 V82 H38 V62 H18 V38 H38 Z" fill="#FFFFFF" fill-opacity="0.12" />

  <!-- Cross + Devanagari 'स' Body -->
  <path d="M 40 22 C 40 20 42 19 45 19 H 55 C 58 19 60 20 60 22 V 38 H 68 C 76 38 82 43 82 51 C 82 58 76 63 68 63 H 60 V 78 C 60 80 58 81 55 81 H 45 C 42 81 40 80 40 78 V 62 H 22 C 20 62 19 60 19 57 V 43 C 19 40 20 38 22 38 H 40 Z" fill="url(#favCross)" stroke="#5EEAD4" stroke-width="1.5" stroke-opacity="0.6" />
  
  <!-- 'स' Leg -->
  <path d="M 68 53 C 74 53 78 57 78 64 C 78 72 73 78 65 81" stroke="#E0F2FE" stroke-width="5" stroke-linecap="round" />

  <!-- High-contrast ECG Pulse Line -->
  <path d="M 12 50 H 32 L 37 40 L 43 62 L 51 28 L 58 70 L 64 45 L 68 53 H 88" stroke="url(#favPulse)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Vital Peak Dot -->
  <circle cx="51" cy="28" r="4" fill="#34D399" />
</svg>